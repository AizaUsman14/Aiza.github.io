<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #050505;
    color: white;
    display: flex;
}
.sidebar {
    width: 250px;
    background: #111;
    padding: 20px;
}
.main {
    flex: 1;
    padding: 20px;
}
img {
    width: 80px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="sidebar">
    <h3>MIDNIGHT</h3>
    <img id="profileImage">
    <h5 id="userName"></h5>

    <button onclick="logout()" class="btn btn-danger w-100 mt-3">Logout</button>
</div>

<div class="main">
    <h2>Welcome, <span id="welcome"></span></h2>

    <hr>

    <p><b>Address:</b> <span id="address"></span></p>
    <p><b>Birthdate:</b> <span id="birthdate"></span></p>
    <p><b>Education:</b> <span id="education"></span></p>
</div>

<script>
const user = sessionStorage.getItem("loggedInUser");

if(!user){
    window.location.href = "login.html";
}

const data = JSON.parse(localStorage.getItem("user_" + user));

document.getElementById("userName").innerText = data.username;
document.getElementById("welcome").innerText = data.username;
document.getElementById("address").innerText = data.address;
document.getElementById("birthdate").innerText = data.birthdate;
document.getElementById("education").innerText = data.education;
document.getElementById("profileImage").src = data.profilePic;

function logout(){
    sessionStorage.removeItem("loggedInUser");
    window.location.href = "login.html";
}
</script>

</body>
</html>
