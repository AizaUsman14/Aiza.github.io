<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Midnight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050505; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .dark-card { background: #111111; border: 1px solid #222; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); padding: 50px 40px; width: 100%; max-width: 420px; position: relative; }
        .dark-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(to right, #38bdf8, #a855f7); border-radius: 16px 16px 0 0; }
        
        .form-control { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; padding: 12px 15px; }
        .form-control:focus { background: #1a1a1a; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); color: #fff; }
        .form-control::placeholder { color: #555; }
        label { color: #9ca3af; font-size: 0.85rem; letter-spacing: 1px; }
        
        .btn-submit { background: #fff; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 600; width: 100%; transition: 0.3s; margin-top: 20px; }
        .btn-submit:hover { background: #d1d5db; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .auth-link { color: #9ca3af; text-decoration: none; transition: 0.2s; font-size: 0.9rem;}
        .auth-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="dark-card">
        <h3 class="fw-bold text-white mb-1">Sign In</h3>
        <p class="text-secondary mb-4 small">Authenticate to access the dashboard.</p>
        
        <div id="errorMsg" class="alert alert-danger d-none p-2 text-center small border-0 bg-danger text-white" style="background-color: rgba(220, 38, 38, 0.2) !important; border: 1px solid #ef4444 !important;"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="fw-semibold text-uppercase mb-2">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="fw-semibold text-uppercase mb-2">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-submit">ACCESS SYSTEM</button>
            <div class="text-center mt-4">
                <a href="register.html" class="auth-link">Don't have an account? Register</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const savedData = localStorage.getItem('user_' + username);

            if (savedData) {
                const user = JSON.parse(savedData);
                if (user.password === password) {
                    sessionStorage.setItem('loggedInUser', username);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = "Incorrect password.";
                    errorMsg.classList.remove('d-none');
                }
            } else {
                errorMsg.textContent = "Account not found.";
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
