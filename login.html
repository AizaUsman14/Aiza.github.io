<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.card {
    background: #111;
    color: white;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
}
</style>
</head>

<body>

<div class="card">
    <h3 class="text-center">Login</h3>

    <div id="error" class="alert alert-danger" style="display:none;"></div>

    <form id="loginForm">
        <input type="text" id="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-light w-100">Login</button>
    </form>

    <p class="text-center mt-3">
        <a href="register.html">Create account</a>
    </p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const data = localStorage.getItem("user_" + username);
    const error = document.getElementById("error");

    if(data){
        const user = JSON.parse(data);

        if(user.password === password){
            sessionStorage.setItem("loggedInUser", username);
            window.location.href = "dashboard.html";
        } else {
            error.style.display = "block";
            error.innerText = "Wrong password";
        }
    } else {
        error.style.display = "block";
        error.innerText = "User not found";
    }
});
</script>

</body>
</html>
