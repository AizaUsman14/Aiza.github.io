<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.card {
    background: #111;
    color: white;
    padding: 30px;
    border-radius: 15px;
    width: 400px;
}
</style>
</head>

<body>

<div class="card">
    <h3 class="text-center">Register</h3>

    <div id="msg" class="alert" style="display:none;"></div>

    <form id="registerForm">

        <input type="text" id="username" class="form-control mb-3" placeholder="Username" required>

        <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>

        <input type="text" id="address" class="form-control mb-3" placeholder="Address" required>

        <input type="date" id="birthdate" class="form-control mb-3" required><span id="birthdate"></span>

        <input type="text" id="education" class="form-control mb-3" placeholder="Education" required>

        <input type="file" id="profile_pic" class="form-control mb-3" accept="image/*" required>

        <button class="btn btn-light w-100">Register</button>

    </form>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const address = document.getElementById("address").value;
    const birthdate = document.getElementById("birthdate").value;
    const education = document.getElementById("education").value;
    const file = document.getElementById("profile_pic").files[0];

    const msg = document.getElementById("msg");

    if(file.size > 2 * 1024 * 1024){
        msg.style.display = "block";
        msg.className = "alert alert-danger";
        msg.innerText = "Image too large";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){
        const user = {
            username,
            password,
            address,
            birthdate,
            education,
            profilePic: e.target.result
        };

        localStorage.setItem("user_" + username, JSON.stringify(user));

        msg.style.display = "block";
        msg.className = "alert alert-success";
        msg.innerText = "Registered successfully!";
    };

    reader.readAsDataURL(file);
});
</script>

</body>
</html>
