<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Midnight</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #050505;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.card {
    background: #111;
    color: white;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 450px;
}
.form-control {
    background: #1a1a1a;
    border: 1px solid #333;
    color: white;
}
.form-control:focus {
    background: #1a1a1a;
    color: white;
    border-color: #38bdf8;
    box-shadow: none;
}
img {
    width: 80px;
    border-radius: 10px;
    display: none;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">
    <h3 class="text-center mb-4">Create Account</h3>

    <div id="msg" class="alert text-center" style="display:none;"></div>

    <form id="registerForm">

        <!-- Username -->
        <label class="small text-secondary">Username</label>
        <input type="text" id="username" class="form-control mb-3" required>

        <!-- Password -->
        <label class="small text-secondary">Password</label>
        <input type="password" id="password" class="form-control mb-3" required>

        <!-- Address -->
        <label class="small text-secondary">Address</label>
        <input type="text" id="address" class="form-control mb-3" required>

        <!-- Birthdate -->
        <label class="small text-secondary">Birthdate</label>
        <input type="date" id="birthdate" class="form-control mb-3" required>

        <!-- Education -->
        <label class="small text-secondary">Educational Background</label>
        <input type="text" id="education" class="form-control mb-3" placeholder="e.g. BSIT" required>

        <!-- Profile Pic -->
        <label class="small text-secondary">Profile Image (Max 2MB)</label>
        <input type="file" id="profile_pic" class="form-control mb-2" accept="image/*" required>

        <img id="preview">

        <button class="btn btn-light w-100 mt-3">Register</button>

        <p class="text-center mt-3 small">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </form>
</div>
