<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Midnight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050505; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .dark-card { background: #111111; border: 1px solid #222; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); padding: 40px; width: 100%; max-width: 500px; position: relative; }
        .dark-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(to right, #a855f7, #38bdf8); border-radius: 16px 16px 0 0; }
        
        .form-control { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; padding: 12px 15px; }
        .form-control:focus { background: #1a1a1a; border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15); color: #fff; }
        .form-control::placeholder { color: #555; }
        input[type="file"]::file-selector-button { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; margin-right: 15px; transition: 0.2s; cursor: pointer; }
        input[type="file"]::file-selector-button:hover { background: #444; }
        
        label { color: #9ca3af; font-size: 0.85rem; letter-spacing: 1px; }
        
        .btn-submit { background: #fff; color: #000; border: none; padding: 14px; border-radius: 10px; font-weight: 600; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #d1d5db; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .auth-link { color: #9ca3af; text-decoration: none; transition: 0.2s; font-size: 0.9rem;}
        .auth-link:hover { color: #a855f7; }
    </style>
</head>
<body>
    <div class="dark-card">
        <h3 class="fw-bold text-white mb-4 text-center">Create Identity</h3>
        <div id="statusMsg" class="alert rounded-3 text-center border-0 small" style="display:none;"></div>
        
        <form id="registerForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="fw-semibold text-uppercase mb-2">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="User ID" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="fw-semibold text-uppercase mb-2">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Secret Key" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="fw-semibold text-uppercase mb-2">Base Location</label>
                <input type="text" id="address" class="form-control" placeholder="City, Coordinates" required>
            </div>
            <div class="mb-4">
                <label class="fw-semibold text-uppercase mb-2">Avatar Upload <span class="text-secondary text-lowercase">(Max 2MB)</span></label>
                <input type="file" id="profile_pic" class="form-control" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-submit">REGISTER NODE</button>
            <p class="text-center mt-4 mb-0">
                <a href="login.html" class="auth-link">Already registered? Initialize Login</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const address = document.getElementById('address').value;
            const fileInput = document.getElementById('profile_pic');
            const statusMsgDiv = document.getElementById('statusMsg');

            statusMsgDiv.style.display = 'none';
            statusMsgDiv.className = 'alert rounded-3 text-center border-0 small';

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];

                if (file.size > 2 * 1024 * 1024) {
                    statusMsgDiv.innerHTML = "Error: File size exceeds 2MB limit.";
                    statusMsgDiv.style.backgroundColor = "rgba(220, 38, 38, 0.2)";
                    statusMsgDiv.style.color = "#f87171";
                    statusMsgDiv.style.display = 'block';
                    return; 
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Image = event.target.result;
                    const userAccount = { username, password, address, profilePic: base64Image };

                    try {
                        localStorage.setItem('user_' + username, JSON.stringify(userAccount));
                        statusMsgDiv.innerHTML = "Node created. <a href='login.html' style='color:#38bdf8;'>Login here</a>";
                        statusMsgDiv.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
                        statusMsgDiv.style.color = "#34d399";
                        statusMsgDiv.style.display = 'block';
                        document.getElementById('registerForm').reset();
                    } catch (error) {
                        statusMsgDiv.innerHTML = "Error: Storage capacity reached.";
                        statusMsgDiv.style.backgroundColor = "rgba(220, 38, 38, 0.2)";
                        statusMsgDiv.style.color = "#f87171";
                        statusMsgDiv.style.display = 'block';
                    }
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
